name: Node.js CI/CD

# 1. Triggers: When should this pipeline run?
on:
  push:
    branches: [ "copilot/fix-github-actions-build-and-test" ]
  pull_request:
    branches: [ "copilot/fix-github-actions-build-and-test" ]

# 2. Jobs: What should the pipeline do?
jobs:
  # CI Phase: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # Step A: Bring your code into the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step B: Install the runtime environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Step C: Install your project's dependencies
    - name: Install dependencies
      run: npm install

    # Step D: Run your testing suite
    - name: Run tests
      run: npm test

  # CD Phase: Deploy
  deploy:
    # Ensure this job only runs if 'build-and-test' is successful
    needs: build-and-test
    runs-on: ubuntu-latest
    
    # Only deploy if the push was directly to the main branch
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying application..."
        